name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install \
            msgpack \
            aiosqlite \
            pytest \
            pytest-asyncio \
            langgraph>=1.0 \
            langchain-core>=1.0

      - name: Test
        run: PYTHONPATH=src pytest tests/unit/ tests/integration/test_langgraph_resume.py -v --asyncio-mode=auto

  test-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install \
            msgpack \
            aiosqlite \
            redis \
            pytest \
            pytest-asyncio \
            langgraph>=1.0 \
            langchain-core>=1.0
      - name: Test Redis
        run: PYTHONPATH=src pytest tests/integration/test_redis_backend.py -v --redis-url=redis://localhost:6379
