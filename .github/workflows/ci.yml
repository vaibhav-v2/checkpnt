name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install \
            "msgpack>=1.0" \
            "aiosqlite>=0.19" \
            "pytest>=8.0" \
            "pytest-asyncio>=0.23" \
            "langgraph>=1.0" \
            "langchain-core>=1.0"

      - name: Test
        run: |
          PYTHONPATH=src pytest \
            tests/unit/ \
            tests/integration/test_langgraph_resume.py \
            -v --asyncio-mode=auto
